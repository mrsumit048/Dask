<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceef4;--surface:#fff;--ink:#1f2a44;--muted:#5d6784;--accent:#f2b632;--accent-ink:#1f2a44;--line:#d3d8e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121828;--surface:#1b2438;--ink:#eceef4;--muted:#9aa5c4;--line:#2c3856}}
:root[data-theme="dark"]{--bg:#121828;--surface:#1b2438;--ink:#eceef4;--muted:#9aa5c4;--line:#2c3856}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
#bgimg{position:fixed;inset:0;z-index:-1;display:none;background-size:cover;background-position:center;background-repeat:no-repeat}
#bgimg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--bgo,.55)}
html.hasbg #bgimg{display:block}
html.hasbg header{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(1rem,4.6vw,1.5rem);line-height:1.1;letter-spacing:-.03em;min-width:0}
.logo .mark{flex:none}
.logo img{height:34px;width:auto;max-width:140px;object-fit:contain;border-radius:6px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.2rem}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cartbtn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 16px;font-weight:600}
.hero{padding:44px 20px 24px;max-width:960px;margin:0 auto}
.hero h1{font-size:clamp(2.6rem,10vw,5.5rem);line-height:.95;letter-spacing:-.04em;font-weight:800;margin:0 0 14px}
.hero p{max-width:46ch;color:var(--muted);margin:0}
.filters{display:flex;gap:8px;padding:12px 20px;max-width:960px;margin:0 auto;overflow-x:auto}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:12px 20px 48px;max-width:960px;margin:0 auto}
.card{background:var(--surface);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.tile{aspect-ratio:1/1;display:flex;align-items:flex-end;padding:12px;font-size:2rem;font-weight:800;letter-spacing:-.03em;color:#fff;mix-blend-mode:normal}
.info{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{margin:0;font-size:1rem;font-weight:600}
.price{color:var(--muted)}
.row{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btns{display:flex;gap:8px}
.buy{flex:1;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 6px;font-weight:600;font-size:.9rem}
select{flex:1;min-width:0;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.add{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 6px;font-weight:600;font-size:.9rem}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);transform:translateX(100%);transition:transform .25s;z-index:10;display:flex;flex-direction:column;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(0,0,0,.2)}
aside.open{transform:none}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
.savebar{position:sticky;top:0;z-index:2;background:var(--surface);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.savebar small{flex-basis:100%}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h2{margin:0}
.x{background:none;border:0;color:var(--ink);font-size:1.6rem}
.items{flex:1;overflow:auto;margin:12px 0}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;margin-bottom:12px}
.primary{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:12px;font-weight:600}
form{display:flex;flex-direction:column;gap:10px}
input,textarea{padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.hbtns{display:flex;gap:8px;align-items:center}
#ebody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:12px 0}
#ebody h3{margin:8px 0 0}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
input[type=color]{padding:2px;height:36px;width:44px}
.pe{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.pph{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pthumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pe input[data-k=name]{flex:1 1 100%}
.pe input[data-k=cat]{flex:1;min-width:0}
.pe input[data-k=price]{width:80px}
a.primary{display:block;text-align:center;text-decoration:none;margin-top:8px}
.ord{padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.logoup{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}
.logoup .add{flex:none;padding:12px}
.empty{color:var(--muted);padding:20px 0}
.amenu{display:flex;flex-direction:column;gap:8px}
.aopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600}
.aopt .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:8px}
.stat strong{font-size:1.3rem}
.stat small{color:var(--muted)}
.payf{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0;display:flex;flex-direction:column;gap:8px}
.payf legend{color:var(--muted);font-size:.9rem;padding:0 4px}
.payf label.radio{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:1rem}
input[type=radio]{padding:0;width:20px;height:20px;accent-color:var(--accent-ink)}
.upibox{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:none}
.scrim.on{display:block}
</style>
</head>
<body>
<div id="bgimg" aria-hidden="true"></div>
<header>
  <div class="logo" id="logo">Dask Everyday Clothing</div>
  <div class="hbtns"><button class="chip" id="admin">Admin</button><button class="cartbtn" id="open" aria-label="Open cart">Cart (<span id="count">0</span>)</button></div>
</header>
<section class="hero">
  <h1 id="h1">Clothes you'll wear on repeat.</h1>
  <p id="sub">Soft basics in five colors, sized XS to XL. Free returns within 30 days.</p>
</section>
<div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
<main class="grid" id="grid"></main>

<footer style="text-align:center;color:var(--muted);padding:0 20px 32px;font-size:.9rem">© Dask Everyday Clothing</footer>

<div class="scrim" id="scrim"></div>
<aside id="cart" aria-label="Shopping cart" aria-hidden="true">
  <div class="sh"><h2 id="ctitle">Your cart</h2><button class="x" id="close" aria-label="Close cart">×</button></div>
  <div class="items" id="items"></div>
  <div id="foot"></div>
</aside>
<aside id="editor" aria-label="Edit store" aria-hidden="true">
  <div class="sh"><h2 id="etitle">Admin</h2><button class="x" id="eclose" aria-label="Close editor">×</button></div>
  <div id="ebody"></div>
</aside>

<script>
const DEFAULT_PRODUCTS=[
 {id:1,name:"Heavyweight tee",cat:"Tops",price:28,color:"#3b5bdb"},
 {id:2,name:"Boxy hoodie",cat:"Tops",price:64,color:"#6741d9"},
 {id:3,name:"Linen shirt",cat:"Tops",price:52,color:"#0b7285"},
 {id:4,name:"Straight jeans",cat:"Bottoms",price:78,color:"#364fc7"},
 {id:5,name:"Pleated trousers",cat:"Bottoms",price:70,color:"#495057"},
 {id:6,name:"Cargo shorts",cat:"Bottoms",price:48,color:"#2b8a3e"},
 {id:7,name:"Rain shell",cat:"Outerwear",price:110,color:"#c2255c"},
 {id:8,name:"Wool overcoat",cat:"Outerwear",price:190,color:"#5f3dc4"},
 {id:9,name:"Rib beanie",cat:"Accessories",price:22,color:"#e8590c"},
 {id:10,name:"Canvas tote",cat:"Accessories",price:26,color:"#1971c2"}
];
const SIZES=["XS","S","M","L","XL"];
const DEF={brand:"Dask Everyday Clothing",headline:"Clothes you'll wear on repeat.",sub:"Soft basics in five colors, sized XS to XL. Free returns within 30 days.",accent:"#f2b632",logo:"",cur:"$",wa:"",upi:"",upiNo:"",qr:"",qrData:"",bg:"",bgo:55};
let S={...DEF},PRODUCTS=JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
const LG=k=>{try{return localStorage.getItem("dask-"+k)??localStorage.getItem("hemline-"+k)}catch(e){return null}};
try{const d=JSON.parse(LG("store")||"null");if(d){S={...DEF,...d.S};if(!S.brand||/^hemline$/i.test(S.brand.trim()))S.brand=DEF.brand;if(Array.isArray(d.P))PRODUCTS=d.P}}catch(e){}
let dirty=false;
function saveStore(){try{const j=JSON.stringify({S,P:PRODUCTS});localStorage.setItem("dask-store",j);return localStorage.getItem("dask-store")===j}catch(e){return false}}
function markDirty(){dirty=true;const b=$("savebtn");if(b){b.textContent="Save changes";b.disabled=false}const m=$("savemsg");if(m)m.textContent="Unsaved changes"}
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
let cart=[],cat="All";
try{cart=JSON.parse(LG("cart")||"[]")}catch(e){cart=[]}
const $=id=>document.getElementById(id);
const money=n=>(S.cur||"")+n.toFixed(2);
function save(){try{localStorage.setItem("dask-cart",JSON.stringify(cart))}catch(e){}}

function renderFilters(){
  const cats=["All",...new Set(PRODUCTS.map(p=>p.cat))];
  if(!cats.includes(cat))cat="All";
  $("filters").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderFilters();renderGrid()});
}
function renderGrid(){
  $("grid").innerHTML=PRODUCTS.filter(p=>cat==="All"||p.cat===cat).map(p=>`
  <article class="card">
    <div class="tile" style="background:${p.img?`#ddd url(${esc(p.img)}) center/cover no-repeat`:esc(p.color)}"${p.img?` role="img" aria-label="${esc(p.name)}"`:""}>${p.img?"":esc(p.cat)}</div>
    <div class="info"><h3>${p.name}</h3><span class="price">${money(p.price)}</span>
      <div class="row"><div><select aria-label="Size for ${p.name}" id="s${p.id}">${SIZES.map(s=>`<option ${s==="M"?"selected":""}>${s}</option>`).join("")}</select>
      </div><div class="btns"><button class="add" data-id="${p.id}">Add to cart</button><button class="buy" data-id="${p.id}">Buy now</button></div></div></div>
  </article>`).join("");
  $("grid").querySelectorAll(".add").forEach(b=>b.onclick=()=>add(+b.dataset.id,$("s"+b.dataset.id).value));
  $("grid").querySelectorAll(".buy").forEach(b=>b.onclick=()=>add(+b.dataset.id,$("s"+b.dataset.id).value,true));
}
function add(id,size,buy){
  const l=cart.find(i=>i.id===id&&i.size===size);
  l?l.q++:cart.push({id,size,q:1});
  save();renderCart();openCart();
  if(buy)checkout();
}
function change(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();renderCart()}
function totals(){return cart.reduce((s,l)=>s+PRODUCTS.find(p=>p.id===l.id).price*l.q,0)}
function renderCart(){
  cart=cart.filter(l=>PRODUCTS.some(p=>p.id===l.id));
  $("count").textContent=cart.reduce((s,l)=>s+l.q,0);
  $("ctitle").textContent="Your cart";
  if(!cart.length){$("items").innerHTML='<p class="empty">Your cart is empty. Pick a size and tap Add.</p>';$("foot").innerHTML="";return}
  $("items").innerHTML=cart.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.id);return `
  <div class="item"><div>${p.name}<br><small>Size ${l.size} · ${money(p.price)}</small></div>
  <div class="qty"><button data-i="${i}" data-d="-1" aria-label="Remove one">−</button>${l.q}<button data-i="${i}" data-d="1" aria-label="Add one">+</button></div></div>`}).join("");
  $("items").querySelectorAll(".qty button").forEach(b=>b.onclick=()=>change(+b.dataset.i,+b.dataset.d));
  $("foot").innerHTML=`<div class="total"><span>Total</span><span>${money(totals())}</span></div><button class="primary" id="go">Checkout</button>`;
  $("go").onclick=checkout;
}
async function decodeQR(canvas){
  try{const ctx=canvas.getContext("2d"),id=ctx.getImageData(0,0,canvas.width,canvas.height);
    if(window.jsQR){const r=jsQR(id.data,id.width,id.height);if(r&&r.data)return r.data}}catch(e){}
  try{if("BarcodeDetector" in window){const r=await new BarcodeDetector({formats:["qr_code"]}).detect(canvas);if(r[0]&&r[0].rawValue)return r[0].rawValue}}catch(e){}
  return null;
}
function buildUpiLink(total,ref){
  let pa=(S.upi||"").trim(),pn=S.brand,mc="";
  if(S.qrData){try{const q=new URLSearchParams(S.qrData.split("?")[1]||"");pa=q.get("pa")||pa;pn=q.get("pn")||pn;mc=q.get("mc")||""}catch(e){}}
  if(!pa)return "";
  const e=encodeURIComponent;
  return `upi://pay?pa=${e(pa).replace(/%40/g,"@")}&pn=${e(pn)}${mc?`&mc=${e(mc)}`:""}&am=${total.toFixed(2)}&cu=INR&tn=${e("Order "+ref)}`;
}
function upiInfoHtml(){
  if(!S.qr&&!S.upiNo&&!S.upi)return '<p class="empty" style="padding:0">The store hasn\'t added UPI details yet. Please confirm payment with the store on WhatsApp.</p>';
  return (S.qr?`<img src="${esc(S.qr)}" alt="UPI QR code" style="width:100%;max-width:230px;display:block;margin:0 auto 10px;border-radius:8px;background:#fff">`:"")
   +(S.upiNo?`<div>UPI number: <strong>${esc(S.upiNo)}</strong></div>`:"")
   +(S.upi?`<div>UPI ID: <strong>${esc(S.upi)}</strong></div>`:"");
}
/* ===== Online payment (Razorpay + your backend). PAID only after server verification ===== */
const API_BASE="https://dask-pay.YOUR-SUBDOMAIN.workers.dev"; /* <-- apna Cloudflare Worker URL yahan daalo */
const API_READY=!/YOUR-SUBDOMAIN/.test(API_BASE);
const rnd=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
function idemFor(sig){let x=null;try{x=JSON.parse(sessionStorage.getItem("dask-idem")||"null")}catch(e){}if(!x||x.sig!==sig){x={sig,k:rnd()};try{sessionStorage.setItem("dask-idem",JSON.stringify(x))}catch(e){}}return x.k}
async function api(path,opt){const r=await fetch(API_BASE+path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed ("+r.status+")");return j}
const jpost=(path,b)=>api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const loadRzp=()=>new Promise((ok,no)=>{if(window.Razorpay)return ok();const t=document.createElement("script");t.src="https://checkout.razorpay.com/v1/checkout.js";t.onload=ok;t.onerror=()=>no(new Error("Couldn't load the payment window. Check your internet."));document.head.appendChild(t)});
let ONL=null;
function pscreen(title,html,foot){$("ctitle").textContent=title;$("items").innerHTML=html;$("foot").innerHTML=foot||"";openCart()}
const pwait=(t,m)=>pscreen(t,`<p><strong>${esc(t)}</strong></p><p class="empty">${esc(m)}</p>`,"");
function pfail(t,m){pscreen("Payment not completed",`<p><strong>${esc(t)}</strong></p><p>${esc(m)}</p><p class="empty">Order ID: ${esc(ONL.o.orderId)} · Status: NOT PAID</p>`,`<button class="primary" id="retry">Try payment again</button>`);$("retry").onclick=openRzp}
async function startOnline(d){
  const btn=$("pay"),box=$("upiinfo"),err=m=>{box.hidden=false;box.textContent=m;btn.disabled=false};
  if(!API_READY)return err("Online payment is not set up yet. Please choose Cash on Delivery or contact the store.");
  btn.disabled=true;
  try{
    const o=await jpost("/create-order",{idem:idemFor(JSON.stringify([cart,d.mobile,d.address,d.pin])),items:cart.map(l=>({id:l.id,size:l.size,q:l.q})),customer:{name:d.name,mobile:d.mobile,address:d.address,pin:d.pin,city:d.city}});
    ONL={o,d,lines:cart.map(l=>{const p=PRODUCTS.find(x=>x.id===l.id);return `${p.name} (${l.size}) x${l.q}`}),done:false,paying:false};
    if(o.status==="PAID")return onPaid(o.paymentId);
    await loadRzp();openRzp();
  }catch(e){err("Couldn't start payment: "+e.message)}
}
function openRzp(){
  const {o,d}=ONL;ONL.paying=false;
  pwait("Waiting for payment…","Complete the payment in the secure Razorpay window.");
  new Razorpay({key:o.keyId,amount:o.amount,currency:o.currency,order_id:o.rzpOrderId,name:S.brand,description:"Order "+o.orderId,prefill:{name:d.name,contact:d.mobile},theme:{color:S.accent},
    handler:async r=>{ONL.paying=true;pwait("Verifying payment…","Please don't close this page.");try{await jpost("/verify",{orderId:o.orderId,...r})}catch(e){}poll(0)},
    modal:{ondismiss:()=>{if(!ONL.paying&&!ONL.done)pfail("Payment not completed","The payment window was closed. If any amount was deducted, it will be confirmed automatically or refunded by your bank.")}}}).open();
}
async function poll(n){
  if(!ONL||ONL.done)return;
  try{const s=await api("/status?id="+encodeURIComponent(ONL.o.orderId));
    if(s.status==="PAID")return onPaid(s.paymentId);
    if(s.status==="FAILED"&&n>=2)return pfail("Payment failed","Your bank or UPI app declined the payment. This order is NOT paid.");
  }catch(e){}
  if(n>=40){pscreen("Verification pending",`<p>We haven't received the payment confirmation yet. <strong>If money was deducted, please don't pay again</strong> – it will be confirmed automatically, or refunded by your bank.</p><p class="empty">Order ID: ${esc(ONL.o.orderId)}</p>`,`<button class="primary" id="chk">Check again</button>`);$("chk").onclick=()=>{pwait("Checking…","Please wait.");poll(0)};return}
  setTimeout(()=>poll(n+1),3000);
}
function onPaid(pid){
  if(ONL.done)return;ONL.done=true;
  const {o,d,lines}=ONL,amt=o.amount/100,tot="₹"+amt.toFixed(2),wa=(S.wa||"").replace(/\D/g,"");

  bindBack();
  $("ebody").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>setStatus(b.dataset.r,"returned"));
  $("ebody").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>setStatus(b.dataset.c,"cancelled"));
  $("ebody").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setPayStatus(b.dataset.p));
  $("ebody").querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>setStatus(b.dataset.u,"sold"));
}
function openEditStore(){
  if(unlocked){$("etitle").textContent="Edit store";renderEditor()}
  else renderLock("Edit store","Enter password to edit store",PW_EDIT,()=>{unlocked=true;$("etitle").textContent="Edit store";renderEditor()},true);
}
$("admin").onclick=()=>{if(adminOk){renderAdminHome();showEditor()}else renderLock("Admin","Enter admin password",PW_ADMIN,()=>{adminOk=true;renderAdminHome()},false)};
$("eclose").onclick=closeCart;
applySettings();renderFilters();renderGrid();renderCart();
</script>
</body>
</html>
