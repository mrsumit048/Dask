<script type="text/plain" id="src-worker" data-name="worker.js">// Dask Everyday Clothing – payment backend (Cloudflare Workers, free tier) + Razorpay
// Secrets (never in frontend): RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, ADMIN_TOKEN (optional)

// ⚠️ SERVER-SIDE PRICE LIST (in ₹ INR). Customer can't tamper with prices – amount is computed here.
// Keep ids/prices in sync with your website products. New product added on the site => add it here too.
const PRODUCTS = {
  1: { name: "Heavyweight tee", price: 28 },
  2: { name: "Boxy hoodie", price: 64 },
  3: { name: "Linen shirt", price: 52 },
  4: { name: "Straight jeans", price: 78 },
  5: { name: "Pleated trousers", price: 70 },
  6: { name: "Cargo shorts", price: 48 },
  7: { name: "Rain shell", price: 110 },
  8: { name: "Wool overcoat", price: 190 },
  9: { name: "Rib beanie", price: 22 },
  10: { name: "Canvas tote", price: 26 },
};
const SIZES = ["XS", "S", "M", "L", "XL"];
const enc = new TextEncoder();

const json = (o, s = 200, h = {}) =>
  new Response(JSON.stringify(o), { status: s, headers: { "content-type": "application/json", ...h } });

function corsHeaders(env, req) {
  const o = req.headers.get("Origin");
  const allowed = (env.ALLOWED_ORIGIN || "").split(",").map((x) => x.trim()).filter(Boolean);
  return o && allowed.includes(o)
    ? { "Access-Control-Allow-Origin": o, "Access-Control-Allow-Methods": "GET,POST,OPTIONS",
        "Access-Control-Allow-Headers": "Content-Type,Authorization", Vary: "Origin" }
    : {};
}
async function hmacHex(secret, msg) {
  const k = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const s = await crypto.subtle.sign("HMAC", k, enc.encode(msg));
  return [...new Uint8Array(s)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function safeEq(a, b) { // constant-time compare
  a = String(a); b = String(b);
  if (a.length !== b.length) return false;
  let r = 0;
  for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return r === 0;
}
const newId = () => "DK-" + [...crypto.getRandomValues(new Uint8Array(8))].map((b) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
const getOrder = async (env, id) => { const v = await env.ORDERS.get("order:" + id); return v ? JSON.parse(v) : null; };
const saveOrder = (env, o) => env.ORDERS.put("order:" + o.id, JSON.stringify(o));

// ---- status machine: PENDING -> PAID | FAILED ; FAILED -> PAID ; PAID is final ----
async function markPaid(env, o, paymentId) {
  if (o.status === "PAID") {
    if (paymentId && paymentId !== o.paymentId && !(o.extraPayments || []).includes(paymentId)) {
      o.extraPayments = [...(o.extraPayments || []), paymentId]; // duplicate payment -> refund manually
      await saveOrder(env, o);
    }
    return o;
  }
  o.status = "PAID"; o.paymentId = paymentId; o.paidAt = new Date().toISOString();
  await saveOrder(env, o);
  return o;
}
async function markFailed(env, o) {
  if (o.status !== "PENDING") return o; // never downgrade PAID
  o.status = "FAILED"; o.failedAt = new Date().toISOString();
  await saveOrder(env, o);
  return o;
}

async function createOrder(env, body) {
  const idem = String(body.idem || "");
  if (!/^[\w-]{16,64}$/.test(idem)) return json({ error: "Invalid request" }, 400);
  const c = body.customer || {};
  const name = String(c.name || "").trim(), mobile = String(c.mobile || "").trim(),
    address = String(c.address || "").trim(), pin = String(c.pin || "").trim(), city = String(c.city || "").trim();
  if (name.length < 2 || name.length > 60 || !/^\d{10}$/.test(mobile) || address.length < 5 || address.length > 300 ||
      !/^\d{6}$/.test(pin) || city.length < 2 || city.length > 80) return json({ error: "Please check your name, mobile, address, PIN and city." }, 400);
  if (!Array.isArray(body.items) || !body.items.length || body.items.length > 20) return json({ error: "Cart is empty" }, 400);

  let total = 0; const items = [];
  for (const it of body.items) {
    const p = PRODUCTS[it.id], q = Number(it.q);
    if (!p || !SIZES.includes(it.size) || !Number.isInteger(q) || q < 1 || q > 20) return json({ error: "Invalid product in cart" }, 400);
    total += p.price * q; items.push({ id: Number(it.id), name: p.name, size: it.size, q, price: p.price });
  }
  const amount = Math.round(total * 100); // paise

  // duplicate protection: same idempotency key => same order (no second order / second payment link)
  const existingId = await env.ORDERS.get("idem:" + idem);
  if (existingId) {
    const ex = await getOrder(env, existingId);
    if (ex) return json({ orderId: ex.id, rzpOrderId: ex.rzpOrderId, amount: ex.amount, currency: "INR", keyId: env.RAZORPAY_KEY_ID, status: ex.status, paymentId: ex.paymentId || null });
  }
  const id = newId();
  const r = await fetch("https://api.razorpay.com/v1/orders", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Basic " + btoa(env.RAZORPAY_KEY_ID + ":" + env.RAZORPAY_KEY_SECRET) },
    body: JSON.stringify({ amount, currency: "INR", receipt: id, notes: { orderId: id } }),
  });
  if (!r.ok) return json({ error: "Payment gateway error. Please try again." }, 502);
  const rz = await r.json();
  const order = { id, rzpOrderId: rz.id, amount, status: "PENDING", items, customer: { name, mobile, address, pin, city }, createdAt: new Date().toISOString() };
  await saveOrder(env, order);
  await env.ORDERS.put("rzp:" + rz.id, id);
  await env.ORDERS.put("idem:" + idem, id, { expirationTtl: 7 * 86400 });
  return json({ orderId: id, rzpOrderId: rz.id, amount, currency: "INR", keyId: env.RAZORPAY_KEY_ID, status: "PENDING" });
}

// Backend signature check of the checkout response (authentic only if signed with your key secret)
async function verify(env, body) {
  const o = await getOrder(env, String(body.orderId || ""));
  if (!o || o.rzpOrderId !== body.razorpay_order_id || !body.razorpay_payment_id || !body.razorpay_signature) return json({ error: "Invalid" }, 400);
  const exp = await hmacHex(env.RAZORPAY_KEY_SECRET, o.rzpOrderId + "|" + body.razorpay_payment_id);
  if (!safeEq(exp, body.razorpay_signature)) return json({ error: "Signature mismatch" }, 400);
  const u = await markPaid(env, o, body.razorpay_payment_id);
  return json({ status: u.status });
}

async function webhook(env, req) {
  const raw = await req.text();
  const sig = req.headers.get("X-Razorpay-Signature") || "";
  const exp = await hmacHex(env.RAZORPAY_WEBHOOK_SECRET, raw);
  if (!safeEq(exp, sig)) return json({ error: "Bad signature" }, 400); // fake webhooks rejected here
  const evId = req.headers.get("x-razorpay-event-id");
  if (evId) { if (await env.ORDERS.get("evt:" + evId)) return json({ ok: true, duplicate: true }); await env.ORDERS.put("evt:" + evId, "1", { expirationTtl: 3 * 86400 }); }
  let ev; try { ev = JSON.parse(raw); } catch { return json({ error: "Bad body" }, 400); }
  const pay = ev.payload && ev.payload.payment && ev.payload.payment.entity;
  if (!pay || !pay.order_id) return json({ ok: true });
  const oid = await env.ORDERS.get("rzp:" + pay.order_id);
  const o = oid && (await getOrder(env, oid));
  if (!o) return json({ ok: true });
  if ((ev.event === "payment.captured" || ev.event === "order.paid") && pay.status === "captured") {
    if (pay.amount !== o.amount || pay.currency !== "INR") { o.amountMismatch = true; await saveOrder(env, o); return json({ ok: true }); }
    await markPaid(env, o, pay.id);
  } else if (ev.event === "payment.failed") await markFailed(env, o);
  return json({ ok: true });
}

export default {
  async fetch(req, env) {
    const url = new URL(req.url), cors = corsHeaders(env, req);
    const reply = (res) => { Object.entries(cors).forEach(([k, v]) => res.headers.set(k, v)); return res; };
    if (req.method === "OPTIONS") return new Response(null, { status: 204, headers: cors });
    try {
      if (url.pathname === "/create-order" && req.method === "POST") return reply(await createOrder(env, await req.json()));
      if (url.pathname === "/verify" && req.method === "POST") return reply(await verify(env, await req.json()));
      if (url.pathname === "/webhook" && req.method === "POST") return webhook(env, req);
      if (url.pathname === "/status" && req.method === "GET") {
        const o = await getOrder(env, url.searchParams.get("id") || "");
        return reply(o ? json({ status: o.status, paymentId: o.status === "PAID" ? o.paymentId : null }) : json({ error: "Not found" }, 404));
      }
      if (url.pathname === "/admin/orders" && env.ADMIN_TOKEN) {
        if (!safeEq(req.headers.get("Authorization") || "", "Bearer " + env.ADMIN_TOKEN)) return json({ error: "Unauthorized" }, 401);
        const list = await env.ORDERS.list({ prefix: "order:", limit: 200 });
        const orders = (await Promise.all(list.keys.map((k) => env.ORDERS.get(k.name)))).map((v) => JSON.parse(v));
        return json({ orders: orders.sort((a, b) => b.createdAt.localeCompare(a.createdAt)) });
      }
      return reply(json({ error: "Not found" }, 404));
    } catch (e) {
      return reply(json({ error: "Server error" }, 500));
    }
  },
};

<script type="text/plain" id="src-readme" data-name="README.md"># Dask Everyday Clothing – Secure Online Payment (Razorpay)

## Kaise kaam karta hai
1. Customer cart banata hai → naam, mobile, address bharta hai → **Pay online** chunta hai.
2. Website backend ko sirf product id / size / qty bhejti hai. **Amount backend khud calculate karta hai** (price tamper nahi ho sakta). Unique Order ID (`DK-XXXXXXXX`) banta hai, status **PENDING**.
3. Razorpay ki secure window khulti hai (UPI / Card / NetBanking).
4. Payment ke baad backend **signature verify** karta hai (checkout response + Razorpay **webhook**). Sirf verified payment par status **PAID** hota hai. Fake/manual UTR ka koi option hi nahi hai.
5. Sirf **PAID** hone par "Order on WhatsApp" button unlock hota hai. Fail/cancel par clear message + "Try payment again".
6. COD option pehle jaisa chalta hai (WhatsApp me "PAYMENT PENDING").

Status: `PENDING → PAID`, `PENDING → FAILED`, `FAILED → PAID` (retry). `PAID` final hai – kabhi downgrade nahi hota.
Duplicate protection: same cart par double-click = same Order ID; webhook dobara aaye to ignore; ek order par 2 payments aaye to `extraPayments` me flag hota hai (manual refund ke liye).

## Files
- `index.html` – aapki website (design/products same, sirf payment flow badla)
- `backend/worker.js` – Cloudflare Worker (free) – order, verify, webhook
- `backend/wrangler.toml` – config

## Setup (step by step)

### 1) Razorpay account
1. https://razorpay.com par account banao. Pehle **Test Mode** me kaam karo.
2. Dashboard → Settings → API Keys → **Generate Key**. `Key ID` (rzp_test_...) aur `Key Secret` copy karo. **Secret kisi ko mat do, HTML me mat daalo.**
3. Settings → Payment Capture → **Automatic capture** rakho.

### 2) Backend deploy (Cloudflare Workers – free)
```bash
npm install -g wrangler
wrangler login
cd backend
wrangler kv namespace create ORDERS      # output me id milegi -> wrangler.toml me paste karo
```
`wrangler.toml` me badlo: `ALLOWED_ORIGIN` (apna `https://USERNAME.github.io`), `RAZORPAY_KEY_ID`, aur KV `id`.

Secrets set karo (ye sirf server par rehte hain):
```bash
wrangler secret put RAZORPAY_KEY_SECRET       # Razorpay Key Secret
wrangler secret put RAZORPAY_WEBHOOK_SECRET   # koi lamba random text (step 3 me wahi daalna hai)
wrangler secret put ADMIN_TOKEN               # optional: orders dekhne ke liye
wrangler deploy
```
Deploy ke baad URL milega, jaise `https://dask-pay.yourname.workers.dev`.

**Prices:** `backend/worker.js` ke upar `PRODUCTS` list me apne products ki real ₹ prices daalo (id wahi jo website me hain). Razorpay sirf INR leta hai. Website ke Edit store me bhi wahi price rakho, nahi to customer ko alag amount dikhega. Naya product add karo to worker.js me bhi add karke dobara `wrangler deploy` karo.

### 3) Webhook set karo
Razorpay Dashboard → Settings → Webhooks → Add:
- URL: `https://dask-pay.yourname.workers.dev/webhook`
- Secret: wahi jo `RAZORPAY_WEBHOOK_SECRET` me daala
- Events: `payment.captured`, `order.paid`, `payment.failed`

### 4) Frontend (GitHub Pages)
1. `index.html` me ye line dhundo aur apna Worker URL daalo:
   `const API_BASE="https://dask-pay.YOUR-SUBDOMAIN.workers.dev";`
2. GitHub repo me `index.html` upload karo → Settings → Pages → Branch `main` / root → Save.
3. (Existing website me merge karna ho to: `/* ===== Online payment ... */` wala block, `startOnline(d)` ki line checkout handler me, aur "Pay online" radio copy karo.)

### 5) Test (Test Mode)
- UPI: `success@razorpay` = success, `failure@razorpay` = fail
- Card: `4111 1111 1111 1111`, koi bhi future expiry, CVV `123`
- Success par "Payment verified – PAID" + WhatsApp button aana chahiye; fail par button nahi aana chahiye.

### 6) Live jao
Razorpay KYC complete karo → Live keys banao → `RAZORPAY_KEY_ID` (wrangler.toml) aur `RAZORPAY_KEY_SECRET` (secret) badlo → live webhook banao → `wrangler deploy`.

## Sabke orders dekhna
```bash
curl -H "Authorization: Bearer <ADMIN_TOKEN>" https://dask-pay.yourname.workers.dev/admin/orders
```
Isme har order ka status, paymentId, customer details, aur `extraPayments` (duplicate payment) dikhta hai. Website ka Admin panel abhi bhi sirf usi browser ke orders dikhata hai.

## Dhyan rakhne wali baatein
- Free tier limits: Cloudflare Workers ~100k requests/din, KV ~1000 writes/din – chhoti dukaan ke liye kaafi.
- Purane "UPI QR / UPI ID / UTR" fields ab payment me use nahi hote (Edit store me dikhte rahenge, ignore karo).
- Razorpay ke charges (fee) lagte hain; free sirf hosting hai.
- Agar customer payment ke beech page reload kar de, to wo dubara pay karne se pehle `Order ID` ke saath store se confirm kare; server par status verify hota rehta hai.

function renderAdminHome(){
  aview="home";$("etitle").textContent="Admin";
  const items=[["dash","Dashboard"],["orders","Saved orders"],["sold","Net sales"],["returned","Net return"],["cancelled","Net cancel"],["edit","Edit store"],["files","Backend files"]];
  $("ebody").innerHTML=`<div class="amenu">${items.map((it,i)=>`<button class="aopt" type="button" data-v="${it[0]}"><span class="num">${i+1}</span><span>${it[1]}</span></button>`).join("")}</div>`;
  $("ebody").querySelectorAll(".aopt").forEach(b=>b.onclick=()=>b.dataset.v==="edit"?openEditStore():b.dataset.v==="files"?openFiles():renderAdmin(b.dataset.v));
}
function orderCard(o){
  const d=new Date(o.date),ds=isNaN(d)?"":d.toLocaleString(),st=oSt(o);
  const pay=o.pay?(o.pay==="ONLINE"?"Online":o.pay==="UPI"?"UPI":"COD")+(o.payStatus?" · "+(o.payStatus==="paid"?"Paid":"Payment pending"):""):"";
  return `<div class="ord"><strong>${esc(o.ref)}</strong> · ${money(oAmt(o))} <small>${esc(ds)}${pay?" · "+pay:""}${o.utr?" · UTR "+esc(o.utr):""}${o.payId?" · "+esc(o.payId):""}</small><br>${esc(o.name||"")}, ${esc(o.mobile||"")}<br><small>${esc(o.address||"")}${o.city?", "+esc(o.city):""} ${esc(o.pin||"")}</small><br><small>${(o.lines||[]).map(x=>esc(x)).join("; ")}</small><div class="hbtns" style="margin-top:8px;flex-wrap:wrap"><label style="flex:1;min-width:150px">Order status<select data-st="${esc(o.ref)}">${Object.keys(ST).map(k=>`<option value="${k}"${k===st?" selected":""}>${ST[k]}</option>`).join("")}</select></label>${o.payStatus==="pending"?`<button class="chip" data-p="${esc(o.ref)}">Mark payment received</button>`:""}<button class="chip" data-delo="${esc(o.ref)}">Remove order</button></div></div>`;
}
function bindOrderActions(){
  $("ebody").querySelectorAll("[data-st]").forEach(s=>s.onchange=()=>setStatus(s.dataset.st,s.value));
  $("ebody").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setPayStatus(b.dataset.p));
  $("ebody").querySelectorAll("[data-delo]").forEach(b=>b.onclick=()=>{const r=b.dataset.delo;if(!confirm("Remove order "+r+" permanently? This cannot be undone."))return;setOrders(getOrders().filter(x=>x.ref!==r));renderAdmin(aview)});
}
let ofilter="all";
function renderSaved(){
  $("etitle").textContent="Saved orders";
  const all=getOrders(),keys=["all",...Object.keys(ST)];
  const cnt=k=>k==="all"?all.length:all.filter(x=>oSt(x)===k).length;
  const l=ofilter==="all"?all:all.filter(x=>oSt(x)===ofilter);
  $("ebody").innerHTML=`${aBack}<div class="filters" style="padding:0" role="group" aria-label="Filter orders">${keys.map(k=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${k===ofilter}">${k==="all"?"All":ST[k]} (${cnt(k)})</button>`).join("")}</div>${l.length?l.map(x=>orderCard(x)).join(""):'<p class="empty">No orders here yet.</p>'}`;
  bindBack();
  $("ebody").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ofilter=b.dataset.f;renderSaved()});
  bindOrderActions();
}
function renderDash(){
  $("etitle").textContent="Dashboard";
  const o=getOrders(),by=k=>o.filter(x=>oSt(x)===k),pen=by("pending"),del=by("delivered"),ret=by("returned"),can=by("cancelled");
  const stat=(l,v,n)=>`<div class="stat"><small>${l}</small><strong>${v}</strong><small>${n}</small></div>`;
  $("ebody").innerHTML=`${aBack}<div class="stats">${stat("Pending",money(sumA(pen)),pen.length+" orders")}${stat("Net sales (delivered)",money(sumA(del)),del.length+" orders")}${stat("Net return",money(sumA(ret)),ret.length+" orders")}${stat("Net cancel",money(sumA(can)),can.length+" orders")}${stat("All orders",money(sumA(o)),o.length+" orders")}${stat("Products",PRODUCTS.length,"in store")}</div><h3>Recent orders</h3>${o.length?o.slice(0,5).map(x=>`<div class="ord"><strong>${esc(x.ref)}</strong> · ${money(oAmt(x))} · <small>${ST[oSt(x)]}</small><br>${esc(x.name||"")}</div>`).join(""):'<p class="empty">No orders yet.</p>'}`;
  bindBack();
}
function renderOrders(kind){
  const T={sold:"Net sales",returned:"Net return",cancelled:"Net cancel"},key=kind==="sold"?"delivered":kind;
  $("etitle").textContent=T[kind];
  const l=getOrders().filter(x=>oSt(x)===key);
  $("ebody").innerHTML=`${aBack}<div class="stat"><small>${T[kind]}</small><strong>${money(sumA(l))}</strong><small>${l.length} orders</small></div>${l.length?l.map(x=>orderCard(x)).join(""):'<p class="empty">No orders here yet.</p>'}`;
  bindBack();bindOrderActions();
}
function openEditStore(){
  if(unlocked){$("etitle").textContent="Edit store";renderEditor()}
  else renderLock("Edit store","Enter password to edit store",PW_EDIT,()=>{unlocked=true;$("etitle").textContent="Edit store";renderEditor()},true);
}
$("admin").onclick=()=>{if(adminOk){renderAdminHome();showEditor()}else renderLock("Admin","Enter admin password",PW_ADMIN,()=>{adminOk=true;renderAdminHome()},false)};
$("eclose").onclick=closeCart;
applySettings();renderFilters();renderGrid();renderCart();
</script>
<script>
/* Backend files viewer: worker.js, wrangler.toml, README.md are embedded in this page */
(function(){
  const KEYS=["worker","wrangler","readme"];let cur="worker";
  const g=id=>document.getElementById(id);
  const src=k=>{const e=g("src-"+k);return{name:e.dataset.name,text:e.textContent.replace(/<\\\/script/g,"</script")}};
  function show(k){
    cur=k;const f=src(k);
    g("fname").textContent=f.name;g("fpre").textContent=f.text;g("fpre").classList.toggle("wrap",k==="readme");g("fpre").scrollTop=0;
    g("ftabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
    g("fcopy").textContent="Copy";
  }
  window.openFiles=function(){
    g("ftabs").innerHTML=KEYS.map(k=>`<button class="chip" type="button" data-k="${k}" aria-pressed="false">${src(k).name}</button>`).join("");
    g("ftabs").querySelectorAll("button").forEach(b=>b.onclick=()=>show(b.dataset.k));
    g("files").hidden=false;show(cur);g("fclose").focus();
  };
  const close=()=>{g("files").hidden=true};
  g("fclose").onclick=close;
  g("files").addEventListener("click",e=>{if(e.target===g("files"))close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!g("files").hidden){e.stopPropagation();close()}},true);
  g("fcopy").onclick=async()=>{
    const t=src(cur).text;
    try{await navigator.clipboard.writeText(t)}catch(e){const r=document.createRange();r.selectNodeContents(g("fpre"));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand("copy")}catch(x){}s.removeAllRanges()}
    g("fcopy").textContent="Copied ✓";
  };
  g("fdl").onclick=()=>{const f=src(cur),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([f.text],{type:"text/plain"}));a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
})();
</script>
